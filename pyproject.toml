[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-intelligence"
version = "0.1.0"
description = "Provenance-first intelligence and agent orchestration platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "duckdb>=1.0,<2",
]

[project.optional-dependencies]
retrieval = ["qdrant-client>=1.12,<2", "neo4j>=5.25,<6"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/intelligence"]

[tool.pytest.ini_options]
pythonpath = ["src"]
